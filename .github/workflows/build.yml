name: Build

on:
  push:
    branches: [main, dotnet]
    tags: ["v*"] # 推送版本标签（如 v1.0.0）时触发，并发布 Release
    # 仅当两个项目目录有变更时才触发构建。
    # 注意：GitHub 不对 tag 推送评估 paths，所以打标签发布 Release 不受影响。
    paths:
      - "dotnet/LeigodPause/**"
      - "dotnet/LeigodPause.Service/**"
  workflow_dispatch: # 手动触发不受 paths 限制

jobs:
  build:
    name: Build (net481)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "9.0.x"

      # 与本地发布流程一致：执行仓库内的 publish.ps1
      # （脚本在 CI 下会自动跳过 Windows 服务启停与交互式 pause）
      - name: Publish (run publish.ps1)
        shell: pwsh
        working-directory: dotnet
        run: ./publish.ps1

      - name: Upload publish artifact
        uses: actions/upload-artifact@v7
        with:
          name: LeigodPause-publish
          path: dotnet/publish
          if-no-files-found: error
          retention-days: 30

  # 仅当推送标签（refs/tags/）时运行：把构建产物打包并发布为 GitHub Release
  release:
    name: Release (tag)
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    timeout-minutes: 30

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    permissions:
      contents: write # 创建 Release 需要写仓库内容权限

    steps:
      - name: Download publish artifact
        uses: actions/download-artifact@v4
        with:
          name: LeigodPause-publish
          path: LeigodPause-publish

      - name: Zip publish artifact
        shell: pwsh
        run: Compress-Archive -Path LeigodPause-publish/* -DestinationPath LeigodPause-${{ github.ref_name }}.zip

      - name: Create GitHub Release
        run: |
          gh release create "$env:GITHUB_REF_NAME" --generate-notes --title "$env:GITHUB_REF_NAME"
