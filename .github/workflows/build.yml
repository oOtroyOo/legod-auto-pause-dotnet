name: Build

on:
  push:
    branches: [ main, dotnet ]
  pull_request:
    branches: [ main, dotnet ]
  workflow_dispatch:

jobs:
  build:
    name: Build (net481)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      # 与本地发布流程一致：执行仓库内的 publish.ps1
      # （脚本在 CI 下会自动跳过 Windows 服务启停与交互式 pause）
      - name: Publish (run publish.ps1)
        shell: pwsh
        working-directory: dotnet
        run: ./publish.ps1

      - name: Upload publish artifact
        uses: actions/upload-artifact@v7
        with:
          name: LeigodPause-publish
          path: dotnet/publish
          if-no-files-found: error
          retention-days: 30
